[project_standards]
schema_version = "1.0"
catalog = "5"

[standards.markdown-frontmatter]
enabled = true
version = "1.6"

[standards.markdown-frontmatter.config]
contract_version = "1.1"
workflow_mode = "caller"
workflow_ownership = "managed"
schema = "markdown-frontmatter"
required = true
include = ["docs/research/**/*.md"]
exclude = [
  "**/*.template.md",
  "AGENTS.md",
  "CLAUDE.md",
  ".agents/**",
  ".claude/**",
  ".codex/**",
  ".github/**",
  "docs/STATUS.md",
  "docs/TODO.md",
  "docs/handoff/**",
  "node_modules/**",
]

[standards.markdown-frontmatter.config.references]
enabled = false
